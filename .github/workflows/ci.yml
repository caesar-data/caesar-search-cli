name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun test
      - name: Types are in sync with the pinned OpenAPI spec
        run: |
          bun run generate:types
          git diff --exit-code src/api/schema.d.ts
      - name: Build runs under plain Node
        run: |
          bun run build
          node dist/index.js version

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # The gitleaks GitHub Action requires a license key for org repos;
      # running the scanner directly does not.
      - run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:latest \
            git --redact --no-banner --config /repo/.gitleaks.toml /repo
